version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: segmed_db
    restart: always
    environment:
      POSTGRES_USER: segmed_admin
      POSTGRES_PASSWORD: segmed_secure_password_2026
      POSTGRES_DB: segmed_crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: segmed_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes

volumes:
  pgdata:
  redisdata:
