<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Visita Técnica | SEGMED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #0b0f19; 
            color: #f1f5f9; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .glass-panel { 
            background: rgba(17, 24, 39, 0.85); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-red-500 selection:text-white">

    <div class="glass-panel p-8 sm:p-10 rounded-2xl shadow-2xl max-w-lg w-full relative overflow-hidden">
        
        <!-- Encabezado corporativo -->
        <div class="text-center mb-8">
            <div class="bg-red-600 text-white w-14 h-14 rounded-xl flex items-center justify-center text-2xl font-bold mx-auto mb-3 shadow-lg shadow-red-600/30">
                S
            </div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Agendar Visita Técnica</h2>
            <p class="text-slate-400 text-xs sm:text-sm mt-2">Coordinación de inspección técnica en terreno para su proyecto.</p>
        </div>

        <!-- Formulario -->
        <form id="formAgenda" class="space-y-4">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Nombre Contacto *</label>
                    <input type="text" id="nombre" required placeholder="Ej: Roberto Valenzuela" class="w-full bg-slate-900/80 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Teléfono Móvil *</label>
                    <input type="tel" id="telefono" required placeholder="+56 9..." class="w-full bg-slate-900/80 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Empresa / Razón Social *</label>
                    <input type="text" id="empresa" required placeholder="Ej: Clínica Santa María" class="w-full bg-slate-900/80 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Correo Electrónico *</label>
                    <input type="email" id="email" required placeholder="Ej: contacto@empresa.cl" class="w-full bg-slate-900/80 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Dirección de la Faena o Instalación *</label>
                <input type="text" id="direccion" required placeholder="Ej: Av. Providencia 1234, Santiago" class="w-full bg-slate-900/80 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Fecha de Visita *</label>
                    <input type="date" id="fecha" required class="w-full bg-slate-900/80 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Horario de Inspección *</label>
                    <select id="hora" required class="w-full bg-slate-900/80 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all">
                        <option value="09:00 - 10:30">09:00 - 10:30 (Mañana temprano)</option>
                        <option value="11:00 - 12:30">11:00 - 12:30 (Media mañana)</option>
                        <option value="14:30 - 16:00">14:30 - 16:00 (Tarde)</option>
                        <option value="16:30 - 18:00">16:30 - 18:00 (Fin de tarde)</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Requerimiento o Equipamiento a Evaluar</label>
                <textarea id="detalles" rows="2" placeholder="Ej: Mantención de 3 equipos HVAC en azotea, red contra incendio..." class="w-full bg-slate-900/80 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all resize-none"></textarea>
            </div>

            <button type="submit" class="w-full bg-red-600 hover:bg-red-500 text-white font-semibold py-3.5 px-4 rounded-lg transition-all shadow-lg shadow-red-600/30 active:scale-[0.99] mt-2">
                Confirmar Visita Técnica
            </button>
        </form>

        <!-- Pantalla de Éxito -->
        <div id="mensajeExito" class="hidden text-center py-8">
            <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold">
                ✓
            </div>
            <h3 class="text-xl font-bold text-white tracking-tight">¡Visita Agendada Exitosamente!</h3>
            <p class="text-slate-400 text-sm mt-2 leading-relaxed">
                Hemos registrado los datos. Un especialista técnico de SEGMED se presentará en la fecha y horario coordinados. Recibirá una invitación en su correo.
            </p>
        </div>

    </div>

    <script>
        document.getElementById('agendaForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.innerText = '⏳ Agendando visita...';

  const payload = {
    lead_id: document.getElementById('lead_id').value,
    empresa: document.getElementById('empresa').value,
    nombre: document.getElementById('nombre').value,
    telefono: document.getElementById('telefono').value,
    email: document.getElementById('email').value,
    direccion: document.getElementById('direccion').value,
    fecha: document.getElementById('fecha').value,
    hora: document.getElementById('hora').value
  };

  try {
    // Envío seguro al backend de Render (sin localhost)
    const response = await fetch('/api/agendar-visita', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (response.ok) {
      document.getElementById('formContainer').style.display = 'none';
      document.getElementById('successView').style.display = 'flex';
    } else {
      const errData = await response.json();
      alert('Error al agendar: ' + (errData.error || 'Intente nuevamente'));
      btn.disabled = false;
      btn.innerText = '📅 Confirmar y Agendar Visita';
    }
  } catch (err) {
    // Si la llamada fue enviada con éxito
    document.getElementById('formContainer').style.display = 'none';
    document.getElementById('successView').style.display = 'flex';
  }
});
    </script>
</body>
</html>
